<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroShop</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
      button { padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
      #products { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 20px; }
      .product { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; }
      .product h2 { margin-top: 0; font-size: 20px; }
    </style>
  </head>
  <body>
    <h1 id="store-name">ElectroShop</h1>
    <p>Electronic products for your everyday needs.</p>
    <button id="load-products" type="button">Load Products</button>
    <div id="products" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
